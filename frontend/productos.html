<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Productos Sin TACC | CeliaConnect</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <!-- Estilos propios -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <div id="header-placeholder"></div>


    <!-- ================= MAIN ================= -->
    <main>

        <!-- ================= ENCABEZADO ================= -->
        <section id="page-header">

            <div class="container">

                <!-- Breadcrumb -->
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-3">
                        <li class="breadcrumb-item">
                            <a href="index.html">Inicio</a>
                        </li>

                        <li
                            class="breadcrumb-item active"
                            aria-current="page"
                        >
                            Productos
                        </li>
                    </ol>
                </nav>


                <h1 class="fw-bold mb-2">
                    Productos Sin TACC
                </h1>

                <p class="text-muted mb-4">
                    Alimentos certificados, filtrados por categoría y marca.
                </p>


                <!-- Buscador -->
                <div class="search-box">

                    <i class="bi bi-search"></i>

                    <input
                        type="text"
                        id="buscar-producto"
                        class="form-control form-control-lg"
                        placeholder="Buscar productos o marcas..."
                        aria-label="Buscar productos o marcas"
                    >

                </div>

            </div>

        </section>


        <!-- ================= LISTADO + FILTROS ================= -->
        <section id="listado" class="py-5">

            <div class="container">

                <div class="row g-4">


                    <!-- ================= FILTROS DESKTOP ================= -->
                    <aside class="col-lg-3 d-none d-lg-block">

                        <div class="filters-card">

                            <!-- Categorías -->
                            <h6 class="filters-title">
                                Categoría
                            </h6>

                            <div class="form-check mb-2">
                                <input
                                    class="form-check-input filtro-categoria"
                                    type="checkbox"
                                    id="cat-harinas"
                                    value="Harinas"
                                >
                                <label
                                    class="form-check-label"
                                    for="cat-harinas"
                                >
                                    Harinas
                                </label>
                            </div>

                            <div class="form-check mb-2">
                                <input
                                    class="form-check-input filtro-categoria"
                                    type="checkbox"
                                    id="cat-panificados"
                                    value="Panificados"
                                >
                                <label
                                    class="form-check-label"
                                    for="cat-panificados"
                                >
                                    Panificados
                                </label>
                            </div>

                            <div class="form-check mb-2">
                                <input
                                    class="form-check-input filtro-categoria"
                                    type="checkbox"
                                    id="cat-galletitas"
                                    value="Galletitas"
                                >
                                <label
                                    class="form-check-label"
                                    for="cat-galletitas"
                                >
                                    Galletitas
                                </label>
                            </div>

                            <div class="form-check mb-2">
                                <input
                                    class="form-check-input filtro-categoria"
                                    type="checkbox"
                                    id="cat-snacks"
                                    value="Snacks"
                                >
                                <label
                                    class="form-check-label"
                                    for="cat-snacks"
                                >
                                    Snacks
                                </label>
                            </div>

                            <div class="form-check mb-2">
                                <input
                                    class="form-check-input filtro-categoria"
                                    type="checkbox"
                                    id="cat-lacteos"
                                    value="Lácteos"
                                >
                                <label
                                    class="form-check-label"
                                    for="cat-lacteos"
                                >
                                    Lácteos
                                </label>
                            </div>

                            <div class="form-check mb-3">
                                <input
                                    class="form-check-input filtro-categoria"
                                    type="checkbox"
                                    id="cat-bebidas"
                                    value="Bebidas"
                                >
                                <label
                                    class="form-check-label"
                                    for="cat-bebidas"
                                >
                                    Bebidas
                                </label>
                            </div>


                            <hr class="filters-divider">


                            <!-- Marcas -->
                            <h6 class="filters-title">
                                Marca
                            </h6>

                            <div class="form-check mb-2">
                                <input
                                    class="form-check-input filtro-marca"
                                    type="checkbox"
                                    id="marca-puravida"
                                    value="Pura Vida"
                                >
                                <label
                                    class="form-check-label"
                                    for="marca-puravida"
                                >
                                    Pura Vida
                                </label>
                            </div>

                            <div class="form-check mb-2">
                                <input
                                    class="form-check-input filtro-marca"
                                    type="checkbox"
                                    id="marca-natufoods"
                                    value="Natufoods"
                                >
                                <label
                                    class="form-check-label"
                                    for="marca-natufoods"
                                >
                                    Natufoods
                                </label>
                            </div>

                            <div class="form-check mb-2">
                                <input
                                    class="form-check-input filtro-marca"
                                    type="checkbox"
                                    id="marca-celisabor"
                                    value="Celisabor"
                                >
                                <label
                                    class="form-check-label"
                                    for="marca-celisabor"
                                >
                                    Celisabor
                                </label>
                            </div>

                            <div class="form-check mb-3">
                                <input
                                    class="form-check-input filtro-marca"
                                    type="checkbox"
                                    id="marca-glutenfreeco"
                                    value="GlutenFree Co."
                                >
                                <label
                                    class="form-check-label"
                                    for="marca-glutenfreeco"
                                >
                                    GlutenFree Co.
                                </label>
                            </div>


                            <hr class="filters-divider">



                            <button
                                type="button"
                                id="btn-aplicar-filtros"
                                class="btn btn-warning w-100 mb-2"
                            >
                                Aplicar filtros
                            </button>

                            <button
                                type="button"
                                id="btn-limpiar-filtros"
                                class="btn btn-link w-100 text-decoration-none"
                            >
                                Limpiar filtros
                            </button>

                        </div>

                    </aside>


                    <!-- ================= RESULTADOS ================= -->
                    <div class="col-lg-9">


                        <!-- Toolbar -->
                        <div class="listado-toolbar">

                            <!--
                                Este valor se actualizará automáticamente
                                según los productos obtenidos de la API.
                            -->
                            <span
                                class="listado-count"
                                id="productos-count"
                            >
                                Cargando productos...
                            </span>


                            <div class="listado-toolbar-actions">

                                <!-- Botón filtros mobile -->
                                <button
                                    type="button"
                                    class="btn btn-outline-secondary d-lg-none"
                                    data-bs-toggle="offcanvas"
                                    data-bs-target="#filtrosOffcanvas"
                                >
                                    <i class="bi bi-sliders"></i>
                                    Filtros
                                </button>


                                <!-- Ordenamiento -->
                                <select
                                    id="orden-productos"
                                    class="form-select listado-sort"
                                    aria-label="Ordenar productos"
                                >
                                    <option value="relevantes" selected>
                                        Más relevantes
                                    </option>

                                    <option value="calificacion">
                                        Mejor calificados
                                    </option>

                                    <option value="nombre">
                                        Nombre (A-Z)
                                    </option>

                                    <option value="marca">
                                        Marca (A-Z)
                                    </option>
                                </select>

                            </div>

                        </div>


                        <!--
                            ================= PRODUCTOS =================

                            IMPORTANTE:
                            Ya no escribimos las tarjetas manualmente.

                            JavaScript consultará:
                            http://localhost:3000/api/productos

                            y generará las tarjetas dentro de este contenedor.
                        -->
                        <div
                            class="row g-4"
                            id="productos-container"
                        >
                            <!-- Productos cargados dinámicamente -->
                        </div>


                        <!-- ================= PAGINACIÓN ================= -->

                        <!--
                            Por ahora conservamos la estructura visual.

                            Más adelante JavaScript generará automáticamente
                            la cantidad de páginas según la cantidad de
                            productos disponibles.
                        -->
                        <nav
                            aria-label="Paginación de productos"
                            class="mt-5"
                        >

                            <ul
                                class="pagination justify-content-center"
                                id="productos-paginacion"
                            >
                                <!-- Paginación generada por JavaScript -->
                            </ul>

                        </nav>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- ================= FILTROS MOBILE ================= -->
    <div
        class="offcanvas offcanvas-start"
        tabindex="-1"
        id="filtrosOffcanvas"
    >

        <div class="offcanvas-header">

            <h5 class="offcanvas-title">
                Filtros
            </h5>

            <button
                type="button"
                class="btn-close"
                data-bs-dismiss="offcanvas"
                aria-label="Cerrar"
            ></button>

        </div>


        <div class="offcanvas-body">


            <!-- Categorías -->
            <h6 class="filters-title">
                Categoría
            </h6>

            <div class="form-check mb-2">
                <input
                    class="form-check-input filtro-categoria-mobile"
                    type="checkbox"
                    id="m-cat-harinas"
                    value="Harinas"
                >
                <label
                    class="form-check-label"
                    for="m-cat-harinas"
                >
                    Harinas
                </label>
            </div>

            <div class="form-check mb-2">
                <input
                    class="form-check-input filtro-categoria-mobile"
                    type="checkbox"
                    id="m-cat-panificados"
                    value="Panificados"
                >
                <label
                    class="form-check-label"
                    for="m-cat-panificados"
                >
                    Panificados
                </label>
            </div>

            <div class="form-check mb-2">
                <input
                    class="form-check-input filtro-categoria-mobile"
                    type="checkbox"
                    id="m-cat-galletitas"
                    value="Galletitas"
                >
                <label
                    class="form-check-label"
                    for="m-cat-galletitas"
                >
                    Galletitas
                </label>
            </div>

            <div class="form-check mb-2">
                <input
                    class="form-check-input filtro-categoria-mobile"
                    type="checkbox"
                    id="m-cat-snacks"
                    value="Snacks"
                >
                <label
                    class="form-check-label"
                    for="m-cat-snacks"
                >
                    Snacks
                </label>
            </div>

            <div class="form-check mb-2">
                <input
                    class="form-check-input filtro-categoria-mobile"
                    type="checkbox"
                    id="m-cat-lacteos"
                    value="Lácteos"
                >
                <label
                    class="form-check-label"
                    for="m-cat-lacteos"
                >
                    Lácteos
                </label>
            </div>

            <div class="form-check mb-3">
                <input
                    class="form-check-input filtro-categoria-mobile"
                    type="checkbox"
                    id="m-cat-bebidas"
                    value="Bebidas"
                >
                <label
                    class="form-check-label"
                    for="m-cat-bebidas"
                >
                    Bebidas
                </label>
            </div>


            <hr class="filters-divider">


            <!-- Marcas -->
            <h6 class="filters-title">
                Marca
            </h6>

            <div class="form-check mb-2">
                <input
                    class="form-check-input filtro-marca-mobile"
                    type="checkbox"
                    id="m-marca-puravida"
                    value="Pura Vida"
                >
                <label
                    class="form-check-label"
                    for="m-marca-puravida"
                >
                    Pura Vida
                </label>
            </div>

            <div class="form-check mb-2">
                <input
                    class="form-check-input filtro-marca-mobile"
                    type="checkbox"
                    id="m-marca-natufoods"
                    value="Natufoods"
                >
                <label
                    class="form-check-label"
                    for="m-marca-natufoods"
                >
                    Natufoods
                </label>
            </div>

            <div class="form-check mb-2">
                <input
                    class="form-check-input filtro-marca-mobile"
                    type="checkbox"
                    id="m-marca-celisabor"
                    value="Celisabor"
                >
                <label
                    class="form-check-label"
                    for="m-marca-celisabor"
                >
                    Celisabor
                </label>
            </div>

            <div class="form-check mb-3">
                <input
                    class="form-check-input filtro-marca-mobile"
                    type="checkbox"
                    id="m-marca-glutenfreeco"
                    value="GlutenFree Co."
                >
                <label
                    class="form-check-label"
                    for="m-marca-glutenfreeco"
                >
                    GlutenFree Co.
                </label>
            </div>


            <hr class="filters-divider">


            </div>


            <button
                type="button"
                id="btn-aplicar-filtros-mobile"
                class="btn btn-warning w-100 mb-2"
                data-bs-dismiss="offcanvas"
            >
                Aplicar filtros
            </button>

            <button
                type="button"
                id="btn-limpiar-filtros-mobile"
                class="btn btn-link w-100 text-decoration-none"
            >
                Limpiar filtros
            </button>

        </div>

    </div>


    <!-- ================= FOOTER ================= -->
    <div id="footer-placeholder"></div>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- JavaScript general de CeliaConnect -->
    <script src="js/app.js"></script>

    <!-- JavaScript exclusivo de Productos -->
    <script src="js/productos.js"></script>

</body>

</html>
